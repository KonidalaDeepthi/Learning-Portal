{% extends "base.html" %}
{% block title %}403 — Access Denied{% endblock %}
{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;">
  <div>
    <div style="font-size:5rem;margin-bottom:1rem;">🔒</div>
    <h1 style="font-size:4rem;font-weight:900;color:var(--primary);margin-bottom:0;">403</h1>
    <h2 style="font-size:1.3rem;font-weight:700;color:var(--text-primary);margin-bottom:0.75rem;">Access Denied</h2>
    <p style="color:var(--text-secondary);max-width:380px;margin:0 auto 1.5rem;line-height:1.6;">
      You don't have permission to view this page. If you think this is an error, contact your mentor.
    </p>
    <div style="display:flex;gap:0.75rem;justify-content:center;">
      <a href="javascript:history.back()" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Go Back</a>
      <a href="{{ url_for('student.home') }}" class="btn btn-primary"><i class="bi bi-house"></i> Home</a>
    </div>
  </div>
</div>
{% endblock %}
